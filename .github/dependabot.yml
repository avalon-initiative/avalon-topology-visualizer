version: 2

updates:
  # Keeps the workflow files themselves patched. Harmless to leave in even on
  # a repo with no workflows installed yet — it just won't find anything to
  # update.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "developer-experience"
    commit-message:
      prefix: "[noissue] - "
    groups:
      actions-all:
        patterns: ["*"]
