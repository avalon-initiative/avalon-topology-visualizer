name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A few details help us reproduce it quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: e.g. the topology view stops updating after a node drops off the network
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: e.g. the dropped node is marked offline and the rest of the graph keeps updating
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
      value: |
        1.
        2.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.1.0 or main @ abc1234

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Browser / runtime version:
        Deployment mode (if relevant):
